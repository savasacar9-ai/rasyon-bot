name: 7-24 Rasyon Telegram Botu

on:
  schedule:
    # Her 5 saatte bir otomatik tetikleme (00:00, 05:00, 10:00, 15:00, 20:00 UTC)
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: rasyon-bot-runner
  cancel-in-progress: true

jobs:
  run-telegram-bot:
    name: Rasyon Bot 7/24 Kesintisiz Çalisma
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v4

      - name: Python 3.11 Hazirla
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Telegram Botunu Baslat (5 Saat Süreyle Aktif)
        run: |
          echo "=========================================="
          echo "Rasyon Robotu M. Fatih CEYHAN Baslatildi!"
          echo "=========================================="
          # 5 saat (18000 saniye) boyunca botu kesintisiz calistir
          timeout 18000s python bot.py || true
          echo "5 saatlik nobet tamamlandi, sonraki nobet tetikleniyor..."

      - name: Sonraki Nobeti Tetikle (Kesintisiz Döngü)
        if: always()
        run: |
          echo "Yeni calistirma tetikleniyor..."
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot_runner.yml/dispatches \
            -d '{"ref":"main"}' || true
          echo "Tetikleme gönderildi!"
